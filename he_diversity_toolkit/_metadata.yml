project:
  type: book

book:
  title: "Higher Education Diversity Toolkit"
  author: "Kai Prince"
  chapters:
  - part: differences/differences.qmd
    chapters:
      - differences/attention.qmd
  - part: labels-identities/labels-identities.qmd
  - part: recommended_practice/recommended_practice.qmd

format:
  schema-html:
    toc: true
  latex:
    toc: true
  pdf:
    lang: en-GB
    filters:
      - schema
    number-sections: true
    crossref:
      ref-hyperlink: true
    documentclass: article
    pdf-engine: lualatex
    include-in-header:
      - ../../_extensions/kai-prince-sfhea/schema/resources/TexHeader.tex
    keep-tex: true
    toc: true